<!DOCTYPE html>
<html>

  <head>
  <!-- Matomo Tag Manager -->
  <script>
  var _mtm = window._mtm = window._mtm || [];
  _mtm.push({'mtm.startTime': (new Date().getTime()), 'event': 'mtm.Start'});
  var d=document, g=d.createElement('script'), s=d.getElementsByTagName('script')[0];
  g.async=true; g.src='https://cdn.matomo.cloud/rockarch.matomo.cloud/container_xncOI9rn.js'; s.parentNode.insertBefore(g,s);

  <!-- End Matomo Tag Manager -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>MatchBox</title>
    <link rel="stylesheet" type="text/css" href="https://assets.rockarch.org/v0.9.1/main.min.css">
    <!-- <link href="https://fonts.googleapis.com/css?family=Audiowide" rel="stylesheet"> -->
    <link href="vendor/DataTables/datatables.min.css" rel="stylesheet">
    <!-- <link href="vendor/bootstrap/bootstrap.min.css" rel="stylesheet"> -->
    <link href="css/app.css" rel="stylesheet">
  </head>

  <body>
    <div class="grid">
      <div style="grid-column: 2 / span 10">
        
        <div class="header">
          <div>
            <h1>MatchBox</h1>
          </div>
          <div>
            <button class="btn btn--light-blue btn--sm hidden-print" onclick="window.print()">Print List</button>
          </div>
        </div>

        <div class="grid">
          <div style="grid-column: 3 / span 8;">
            <div class="flex" style="justify-content: space-between;">
              <div class="inputs__wrapper">
                <label for="depth">Depth (in inches)</label>
                <input type="text" id="depth">
              </div>
              <div class="inputs__wrapper">
                <label for="width">Width (in inches)</label>
                <input type="text" id="width">
              </div>
              <div class="inputs__wrapper">
                <label for="height">Height (in inches)</label>
                <input type="text" id="height">
              </div>
            </div>
          </div>
        </div>

        <div id="loading" class="wrapper">
          <img src="img/loading.gif" />
        </div>
      
        <table id="results" class="table table-striped" width="100%" style="display:none;">
          <thead>
            <tr>
              <th><button class="btn btn--blue btn--sm" id="clear-count">Clear Counts</button></th>
              <th>Name</th>
              <th>Depth</th>
              <th>Width</th>
              <th>Height</th>
              <th>Cubic Feet</th>
            </tr>
          </thead>
          <tbody>
          </tbody>
        </table>
      </div>
    </div>

    <div class="calculator closed wrapper">
      <h2 class="calculator__text"><span id="total-cubic-feet">0</span> total cubic feet</h2>
    </div>

    <script src="vendor/jQuery/jquery-3.1.0.min.js"></script>
    <script src="vendor/DataTables/datatables.min.js"></script>
    <!-- application scripts -->
    <script src="js/app-config.js"></script>
    <script src="js/app.js?9"></script>
  </body>

</html>
