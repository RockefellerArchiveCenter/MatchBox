<!DOCTYPE html>
<html lang="en">

  <head>
  <!-- Matomo Tag Manager -->

  var _mtm = window._mtm = window._mtm || [];

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>MatchBox</title>
    <link rel="stylesheet" type="text/css" href="https://assets.rockarch.org/v0.9.1/main.min.css">
    <link href="vendor/DataTables/datatables.min.css" rel="stylesheet">
    <link href="css/app.css" rel="stylesheet">
  </head>

  <body>
    <header class="header header--blue">
      <div class="wrapper">
        <div class="container flex">
          <div class="header__brand header__brand--text">
            <a href="/" class="header__brand-title">Matchbox</a>
            <p class="header__brand-subtitle">
              Thinking inside the box
            </p>
          </div>
        </div>
      </div>
    </header>
    <main class="grid mb-30">
      <div class="container--grid">
        <div class="grid">
          <div class="section__dimensions my-30">
            <h2>Minimum Box Dimensions</h2>
            <div class="flex inputs">
              <div class="inputs__wrapper">
                <label for="depth">Depth (in inches)</label>
                <input type="text" id="depth">
              </div>
              <div class="inputs__wrapper">
                <label for="width">Width (in inches)</label>
                <input type="text" id="width">
              </div>
              <div class="inputs__wrapper">
                <label for="height">Height (in inches)</label>
                <input type="text" id="height">
              </div>
            </div>
          </div>
        </div>

        <div id="loading" class="wrapper" aria-label="loading">
          <img alt="" src="img/loading.gif" />
        </div>
      
        <button class="btn btn--blue btn--sm count__button" id="clear-count">Clear Counts</button>
        <table id="results" class="table table-striped" width="100%">
          <thead>
            <tr>
              <th>Count</th>
              <th>Name</th>
              <th>Depth</th>
              <th>Width</th>
              <th>Height</th>
              <th>Cubic Feet</th>
            </tr>
          </thead>
          <tbody>
          </tbody>
        </table>
      </div>

      <div class="calculator closed wrapper">
        <h2 class="calculator__text"><span id="total-cubic-feet">0</span> total cubic feet</h2>
      </div>
    </main>

    <script src="vendor/jQuery/jquery-3.1.0.min.js"></script>
    <script src="vendor/DataTables/datatables.min.js"></script>
    <!-- application scripts -->
    <script src="js/app-config.js"></script>
    <script src="js/app.js?9"></script>
  </body>

</html>
